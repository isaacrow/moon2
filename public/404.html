<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Moon</title>
    <script type="text/javascript">
      // GitHub Pages SPA router
      var path = window.location.pathname;
      var hash = window.location.hash;
      var search = window.location.search;

      if (path.includes('/moon/man') || path.endsWith('/man')) {
        window.location.replace('/?view=moon-manuscripts' + (hash ? '&' + hash.slice(1) : ''));
      } else if (path.includes('/moon')) {
        window.location.replace('/?view=dashboard' + (hash ? '&' + hash.slice(1) : ''));
      } else {
        window.location.replace('/' + search + hash);
      }
    </script>
  </head>
  <body style="background:#090d16;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;">
    <p>Loading Moon Platform...</p>
  </body>
</html>
